<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protocol Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one 640px column. Every drill screen is a pocket protocol card, punched for a coil. */
  --bg:#E3E6EA;
  --card:#FBFBF9;
  --ink:#14181E;
  --muted:#596270;
  --rule:#CBD1D8;
  --accent:#B91C1C;
  --ok:#17784F;
  --ok-bg:#DFF1E8;
  --hl:#FFE36B;
  --hl-ink:#14181E;
  --font-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --card:#181D25; --ink:#E9EDF2; --muted:#98A2AF; --rule:#2C333E;
    --accent:#F25C5C; --ok:#4BC48C; --ok-bg:#15392A; --hl:#F2D04B; --hl-ink:#14181E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --card:#181D25; --ink:#E9EDF2; --muted:#98A2AF; --rule:#2C333E;
  --accent:#F25C5C; --ok:#4BC48C; --ok-bg:#15392A; --hl:#F2D04B; --hl-ink:#14181E;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
button{font-family:inherit}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px}

/* Home */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.tag{align-self:flex-start;font:700 12px/1 var(--font-display);font-stretch:110%;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--accent);padding:6px 8px 5px;border-radius:4px}
.title{font-family:var(--font-display);font-stretch:125%;font-weight:900;font-size:clamp(42px,12vw,68px);line-height:.9;letter-spacing:-.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.lede{color:var(--muted);max-width:50ch;margin:0}
.settings{display:flex;flex-direction:column;gap:10px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.about-btn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:700 14px/1 var(--font-body);padding:8px 14px;border-radius:999px;cursor:pointer}
.set-card{background:var(--card);border:1px solid var(--rule);border-radius:14px;display:flex;flex-direction:column}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;cursor:pointer}
.set-row+.set-row{border-top:1px solid var(--rule)}
.set-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.set-label{font-weight:700;font-size:16px;color:var(--ink)}
.set-cap{font-size:13px;color:var(--muted)}
.about{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.about p{margin:0;line-height:1.5}
.about .sect{margin-top:10px}
.seg{display:inline-flex;align-self:flex-start;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--ink);font:700 14px/1 var(--font-body);padding:9px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--card)}
.note{font-size:14px;color:var(--muted);margin:0;max-width:56ch}
.check{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;align-self:flex-start}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.sect{font:700 12px/1 var(--font-display);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.list{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:stretch;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:15px 16px;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:7px;font:inherit}
.row-main:hover,.row-side:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.row-title{font-family:var(--font-display);font-stretch:106%;font-weight:750;font-size:19px;line-height:1.2}
.row-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.row-side{flex:none;background:none;border:0;border-left:1px solid var(--rule);padding:0 16px;color:var(--ink);font:700 14px var(--font-body);cursor:pointer}
.empty{padding:16px;color:var(--muted);font-size:15px;margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;font:700 12px/1 var(--font-body);padding:5px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.row-main{position:relative}
.reset-timer{position:absolute;top:8px;right:10px;font:700 12px/1 var(--font-body);color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pbar-wrap{display:flex;flex-direction:column;gap:6px;max-width:420px;margin:2px 0 4px}
.pbar-top{font:800 13px/1 var(--font-display);font-stretch:112%;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pbar-top.ok{color:var(--ok)} .pbar-top.gold{color:#A87A12}
.pbar{height:14px;border-radius:999px;background:var(--rule);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:inherit;background:var(--ink);transition:width .6s ease}
.pbar.ok i{background:var(--ok)} .pbar.gold i{background:linear-gradient(110deg,#E8C15A,#FFF0B8 45%,#E3B23C)}
.pbar-label{font-size:14px;font-weight:700;color:var(--ink)}
.pbar-warn{font-size:13px;color:var(--accent);margin:0}
.chip.prog{color:var(--ink);border-color:var(--ink)}
.chip.miss{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--rule);padding-top:14px}
.foot p{margin:0}

/* Drill */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.back{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;background:var(--card);border:1.5px solid var(--ink);color:var(--ink);font:700 15px/1 var(--font-body);padding:9px 14px 9px 10px;border-radius:999px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back .chev{font-size:22px;line-height:0;margin-top:-2px}
.dayrow{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap;text-align:center;font-size:16px;font-weight:700;color:var(--ink);padding:2px 0}
.day-date{color:var(--muted);font-weight:600}
.day-streak{white-space:nowrap}
.day-streak.pending .fire{filter:grayscale(1);opacity:.55}
.tb-right{display:flex;gap:14px;align-items:center;font-size:14px;color:var(--muted)}
.tb-btn{background:none;border:1px solid var(--rule);color:var(--muted);font:700 13px var(--font-body);padding:6px 10px;border-radius:8px;cursor:pointer}
.tb-btn.armed{border-color:var(--accent);color:var(--accent)}
.progress{display:flex;flex-direction:column;gap:6px}
.bar{height:6px;border-radius:999px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
.bar-txt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:10px}
.bar-txt b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:0 12px 26px -20px rgba(0,0,0,.45)}
.holes{height:20px;background:radial-gradient(circle,var(--bg) 0 3.6px,transparent 4.2px) center/22px 20px repeat-x}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.ask{font:700 12px/1 var(--font-display);font-stretch:112%;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.drug{font-family:var(--font-display);font-stretch:112%;font-weight:850;font-size:clamp(26px,6.8vw,40px);line-height:1.02;text-transform:uppercase;margin:0;text-wrap:balance;overflow-wrap:break-word}
.drug.long{font-size:clamp(22px,5.6vw,30px);font-stretch:100%}
.drug.custom{text-transform:none;font-stretch:100%}
.sub{font:600 15px var(--font-display);font-stretch:100%;color:var(--muted)}
.ctx{font-size:18px;font-weight:700;line-height:1.35}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;min-height:22px}
.lbl{font-size:12px;color:var(--muted)}
textarea,input[type="text"]{width:100%;font:18px/1.45 var(--font-body);color:var(--ink);background:var(--card);border:2px solid var(--rule);border-radius:12px;padding:12px 14px}
textarea{min-height:130px;resize:vertical}
textarea:focus,input[type="text"]:focus{outline:none;border-color:var(--ink)}
textarea.good{border-color:var(--ok)}
textarea.shake{animation:shake .32s}
.drug-boxes{display:flex;flex-direction:column;gap:12px}
.drug-boxes.shake{animation:shake .32s}
.db-row{display:block}
.db-name,.drug-lbl{display:block;font-weight:700;font-size:16px;color:var(--ink);margin:0 0 6px 2px}
textarea.db-box{min-height:84px}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:700 16px/1 var(--font-body);border-radius:10px;padding:14px 18px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--card);flex:1}
.btn.danger{border-color:var(--accent);color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 0}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--rule);background:var(--card)}
.fb.ok{border-left:5px solid var(--ok)}
.fb.miss{border-left:5px solid var(--accent)}
.fb-head{font:800 14px/1.3 var(--font-display);font-stretch:110%;text-transform:uppercase;letter-spacing:.06em}
.fb.ok .fb-head{color:var(--ok)}
.fb.miss .fb-head{color:var(--accent)}
.fb-ans{margin:0;font-size:17px;white-space:pre-wrap}
mark.k{background:none;color:inherit;font-weight:700;border-bottom:2px solid var(--muted);padding:0 1px}
mark.k.ok{border-color:var(--ok);color:var(--ok)}
mark.k.miss,.w.miss{background:var(--hl);color:var(--hl-ink);border-bottom:2px solid transparent;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.fb-small{font-size:14px;color:var(--muted);margin:0}
.w.miss.xtra{font-weight:700;padding:0 3px}
b.xb{font-weight:800}
.fb-still{margin:2px 0 0;font-size:14px;font-weight:600;color:var(--accent)}
.w.ord{background:color-mix(in srgb,var(--accent) 14%,transparent);border-bottom:2px dotted var(--accent);border-radius:3px}
.fb-order{font-size:15px;margin:0;color:var(--ink)}
.fix{border:1.5px dashed var(--ink);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.fix-label{font:700 12px/1 var(--font-display);font-stretch:112%;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fix-text{margin:0;font-size:17px;white-space:pre-wrap}
.card-hint{font-size:14px;color:var(--muted);font-style:italic}
.prot-row{display:flex;align-items:center;gap:10px}
.switch-row{display:inline-flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);cursor:pointer;align-self:flex-start}
input[role="switch"]{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--rule);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
input[role="switch"]::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
input[role="switch"]:checked{background:var(--ok)}
input[role="switch"]:checked::after{transform:translateX(18px)}
.prot-row label{font:750 16px var(--font-display);font-stretch:106%;white-space:nowrap}
.prot-row input{flex:1;min-width:0;font-size:17px;padding:10px 12px}
textarea[readonly],input[readonly]{opacity:.5}
input.good{border-color:var(--ok)}
input.shake{animation:shake .32s}
.fb-prot{margin:0;font-size:16px}
.nw{white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn.small{font-size:14px;padding:9px 12px;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:default}
.actions2{display:flex;gap:10px;margin-top:-4px}
.actions2 .btn{flex:1 1 auto}
.actions2 #skipBtn{flex:0 0 auto;white-space:nowrap}
.actions2 #nwBtn .cost{display:block;margin:2px 0 0}
.cost{font-weight:400;font-size:12px;color:var(--muted);margin-left:4px}
.mn-panel{border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.seg.small button{font-size:13px;padding:7px 11px}
.mn-letters{margin:0;font:800 26px/1.2 var(--font-display);font-stretch:112%;letter-spacing:.12em;word-spacing:.15em}
.mn-text{margin:0;font-size:18px;font-weight:700}
.nw-hint{margin:0;font-size:15px;color:var(--ink);background:color-mix(in srgb,var(--hl) 35%,transparent);border-radius:8px;padding:8px 12px}
.live-warn{margin:-8px 0 0;font-size:14px;font-weight:700;color:#B26A00}
textarea.warnb{border-color:#E09A2C;box-shadow:0 0 0 3px color-mix(in srgb,#E09A2C 22%,transparent)}
.switches{display:flex;flex-direction:column;gap:10px}
.search{font-size:17px}
.fb.redo{border-left:5px solid #E09A2C}
.fb.redo .fb-head{color:#B26A00}
.row-icon{flex-direction:row;align-items:center;gap:12px}
.row-text{display:flex;flex-direction:column;gap:7px;min-width:0}
.dc-icon{position:relative;flex:none;width:26px;height:34px;border-radius:5px;border:1.5px solid var(--rule);background:var(--card);overflow:hidden}
.dc-icon::after{content:"";position:absolute;left:0;right:0;top:2px;height:5px;background:radial-gradient(circle,var(--bg) 0 1.6px,transparent 2px) center/7px 5px repeat-x}
.dc-icon.gold{border-color:#A87A12;background:linear-gradient(110deg,#A87A12 0%,#E8C15A 22%,#FFF4C8 38%,#E3B23C 52%,#A87A12 72%,#E8C15A 88%,#FFF4C8 100%);background-size:260% 100%;animation:shimmer 2.6s linear infinite;box-shadow:0 2px 10px -3px rgba(168,122,18,.7)}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-140% 0}}
.chip.gold{background:linear-gradient(110deg,#E8C15A,#FFF0B8 45%,#E3B23C);color:#5A3E00;border-color:transparent}
.stamp.gold{color:#A87A12;border-color:#A87A12}
.fb-note{font-size:14px;color:var(--muted);margin:0;border-top:1px dashed var(--rule);padding-top:8px}
.link{background:none;border:0;padding:2px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font:14px var(--font-body);cursor:pointer;align-self:flex-start;text-align:left}

/* Results */
.stamp{align-self:flex-start;margin:8px 0 4px 6px;font:900 34px/1 var(--font-display);font-stretch:125%;text-transform:uppercase;color:var(--ok);border:4px solid var(--ok);padding:8px 14px 6px;border-radius:8px;transform:rotate(-5deg);animation:stamp .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{from{transform:rotate(-5deg) scale(1.9);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
.h-res{font-family:var(--font-display);font-stretch:118%;font-weight:850;font-size:clamp(30px,8vw,44px);line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0}
.stats div{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px}
.stats dt{font:700 11px/1.2 var(--font-display);font-stretch:112%;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.stats dd{margin:6px 0 0;font:850 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.mlist{list-style:none;margin:0;padding:0}
.mlist li{padding:12px 16px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.mlist li:first-child{border-top:0}
.mlist b{font-family:var(--font-display);font-stretch:106%}
.mlist span{font-size:14px;color:var(--muted)}

/* Study + editor */
.study li{gap:6px}
.study .q-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.study .q-row .btn.small{flex:none;padding:6px 12px;font-size:13px}
.study .q{font-family:var(--font-display);font-stretch:106%;font-weight:750;font-size:17px}
.study .c{font-size:14px;color:var(--muted)}
.study .a{font-size:16px;white-space:pre-wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field textarea{min-height:240px;font-size:16px}
.err{color:var(--accent);font-weight:700;font-size:15px;margin:0}
code{font-size:.92em;background:color-mix(in srgb,var(--ink) 7%,transparent);padding:1px 5px;border-radius:4px}


@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
'use strict';

/*CORE-START*/
const SYN = {
  minutes:'min',minute:'min',mins:'min',secs:'sec',seconds:'sec',
  milligrams:'mg',milligram:'mg',mgs:'mg',micrograms:'mcg',microgram:'mcg',ug:'mcg',mcgs:'mcg',
  grams:'g',gram:'g',gm:'g',gms:'g',milliliters:'ml',milliliter:'ml',millilitres:'ml',millilitre:'ml',mls:'ml',cc:'ml',ccs:'ml',
  kilograms:'kg',kilogram:'kg',kgs:'kg',milliequivalents:'meq',milliequivalent:'meq',maximum:'max',
  intravenous:'iv',intravenously:'iv',intraosseous:'io',intramuscular:'im',intramuscularly:'im',
  intranasal:'nasalroute',intranasally:'nasalroute',sublingual:'sl',sublingually:'sl',
  oral:'po',orally:'po',every:'q',iii:'3',ach:'acetylcholine',
  // Approved abbreviations (single words); each side maps to the same short form.
  patient:'pt',patients:'pt',pts:'pt',
  overdose:'od',overdoses:'od',hypertension:'htn',gastrointestinal:'gi',atrioventricular:'av',sinoatrial:'sa',
  ekg:'ecg',nitroglycerin:'ntg',epinephrine:'epi',magnesium:'mag',wolffparkinsonwhite:'wpw',
  medication:'med',medications:'med',meds:'med',pediatric:'peds',pediatrics:'peds',
  with:'w',without:'wo',hours:'hour',hrs:'hour',years:'yr',year:'yr',yrs:'yr',
  nebulizer:'neb',nebulizers:'neb',nebuliser:'neb',defibrillation:'defib',defibrillations:'defib',
  pacemaker:'pacer',continuous:'cont',administration:'admin'
};
// Approved abbreviations (phrases): the long form and the short form count as the same.
const ABBR=[
  [['acute','coronary','syndrome'],'acs'],
  [['nonsteroidal','antiinflammatory','drug'],'nsaid'],[['non','steroidal','anti','inflammatory','drug'],'nsaid'],
  [['nonsteroidal','anti','inflammatory','drug'],'nsaid'],[['non','steroidal','antiinflammatory','drug'],'nsaid'],
  [['supraventricular','tachycardia'],'svt'],[['ventricular','tachycardia'],'vt'],[['ventricular','fibrillation'],'vf'],
  [['pulseless','electrical','activity'],'pea'],[['congestive','heart','failure'],'chf'],[['myocardial','infarction'],'mi'],
  [['deep','vein','thrombosis'],'dvt'],[['pulmonary','embolism'],'pe'],[['altered','mental','status'],'ams'],
  [['tricyclic','antidepressant'],'tca'],[['wolff','parkinson','white'],'wpw'],[['erectile','dysfunction'],'ed'],
  [['central','nervous','system'],'cns'],[['heart','rate'],'hrate'],[['blood','pressure'],'bp'],[['systolic','bp'],'sbp'],

/* ---- Show next word ---- */
function nextWord(item,text,mode){
  if(item.none) return 'None';
  if(item.na) return 'NA';
  const ref=refOf(item.a,item.phr); const lee=LEEWAY[mode];
  const O=optsOf(item);
  const req=[]; ref.toks.forEach((x,i)=>{ if(!lee.has(x.t)&&!x.opt) req.push(i); });   // (next word shows the card's own words, a joining "and" included)
  const R=req.map(i=>effRef(ref.toks[i].t,O));
  if(!R.length) return null;
  // A word that could start a longer term ("myocardial" → MI) only counts as unfinished if it doesn't already fit.
  // (If the unfinished term's words only moved you on as a stand-in for a wrong word, you're still typing it.)
  let kSkip=0;
  const kOf=txt=>{ const U0=userToks(txt,ref,lee,O); const pend=pendingTail(U0,ref,lee);
    const a=kAt(U0), aS=lastSkip; if(!pend){ kSkip=aS; return a; }
    const b=kAt(U0.slice(0,U0.length-pend)), bS=lastSkip; if(aS){ kSkip=bS; return b; }
    const av=a==null?R.length:a, bv=b==null?R.length:b, useA=av>bv&&av<=bv+pend; kSkip=useA?aS:bS; return useA?a:b; };
  const optT=new Set(ref.toks.filter(x=>x.opt).map(x=>x.t));
  let lastSkip=0;
  const kAt=U1=>{ let k=0; lastSkip=0; const info={};
    // your own "(NS)" right after "normal saline" is the same optional repeat the card has
    const U=U1.filter((t,j)=>!(j>0&&U1[j-1]===t&&optT.has(t)));
    if(!U.length) return 0;

      const lineOf=i=>ref.line[ref.toks[req[i]].wi];
      const am=anyMatch(R,lineOf,U,grpOf(ref)); const lines=[...new Set(R.map((_,i)=>lineOf(i)))];
      let curL=null, end=-1, start=0; am.spans.forEach((sp,L)=>{ if(sp[1]>end){ end=sp[1]; curL=L; start=sp[0]; } });
      const hitSet=new Set(am.pairs.map(p=>p[0]));

      const trail=U.slice(end+1);

        k=R.map((_,i)=>i).find(i=>lineOf(i)===L);
      }
    } else {
      const last=nearLast(R,U,info); lastSkip=info.skipped||0; if(last>=0) k=last+1;
    }

/* ---- Mnemonics: first letter of each adverse effect ---- */
function mnemonicLetters(items,az){
  const list=az?items.slice().sort((x,y)=>x.localeCompare(y,undefined,{sensitivity:'base'})):items;
  return list.map(x=>x.trim().charAt(0).toUpperCase()).join(' ');

// Adverse effects in the order of a mnemonic view: book order, A–Z, or the order of your own mnemonic.
// Each word of your mnemonic picks the effect it stands for (first letters, then the closest start;
// ties go to book order). A mnemonic written as capitals only ("FSDNHFSP") counts letter by letter.
// If it doesn't spell out at least half of the effects, book order is used.
function mnemonicOrder(items,view,mine){
  if(view==='az') return items.slice().sort((x,y)=>x.localeCompare(y,undefined,{sensitivity:'base'}));
  if(view==='mine'&&mine&&String(mine).trim()){
    const caps=!/[a-z]/.test(mine); const keys=[];
    String(mine).split(/[^A-Za-z0-9']+/).filter(w=>/^[A-Za-z]/.test(w)).forEach(w=>{ if(caps&&w.length>1) w.replace(/[^A-Za-z]/g,'').split('').forEach(c=>keys.push(c)); else keys.push(w); });
    const lcp=(a,b)=>{ a=a.toLowerCase(); b=b.toLowerCase(); let k=0; while(k<a.length&&k<b.length&&a[k]===b[k]) k++; return k; };
    const left=items.map((x,i)=>i); const out=[];
    for(const w of keys){ let best=-1,bl=0; left.forEach((i,li)=>{ const l=lcp(w,items[i].trim()); if(l>bl){ bl=l; best=li; } }); if(best>=0){ out.push(items[left[best]]); left.splice(best,1); } }
    if(out.length*2>=items.length) return out.concat(left.map(i=>items[i]));
  }
  return items.slice();
}

 ["Albuterol / Levalbuterol", "• Ineffective in croup and should be avoided.\n• Pediatric patients between 2-6 years of age may be more prone to adverse effects.\n• Do not assume patients have administered their own drug properly. Do not include home doses of albuterol/levalbuterol in your total drug administration consideration.\n• If concerned about aerosolized infectious exposure, substitute with MDI, if available.\n• Patients may need to be instructed on proper use of the MDI.\n• Levalbuterol may be substituted for albuterol and can be combined with ipratropium bromide. This substitution option applies to patients ≥6 years of age."],
 ["Amiodarone", "• If patient is in unstable ventricular tachycardia, synchronized cardioversion should be performed first.\n• Monitor the patient for hypotension and increasing PR and QT intervals.\n• Risk factors for acute hypotension are patients >65 years of age with a history of myocardial infarction.\n• Closely monitor heart rate, blood pressure, and cardiac rhythm during and after administration.\n• Do not infuse with Ringer’s lactate solution."],
 ["Aspirin", "• EMT: Authorized to assist patient to self-medicate own prescribed aspirin up to a maximum dose of 325 mg.\n• Administer aspirin even if discomfort/pain has resolved. If aspirin is not given, document the reason.\n• Aspirin may be withheld if an equivalent dose has been administered by a healthcare professional."],
 ["Atropine", "• May omit atropine in bradycardic patients unlikely to have clinical benefit (e.g., heart transplant patients, second-degree type II, or third-degree heart block).\n• Use cautiously if myocardial infarction or ischemia is suspected, as atropine will increase myocardial oxygen demand, which may worsen the infarct.\n• In organophosphate poisoning, titrate atropine to SLUDGE/BBB signs/symptoms, not to tachycardia. Cardiac monitoring should be considered in all cases of severe organophosphate poisoning."],
 ["Buprenorphine-Naloxone", "• Use of buprenorphine-naloxone is only authorized for agencies participating in the Buprenorphine Pilot Program.\n• Sharp Grossmont Hospital and Palomar Medical Center – Escondido are approved opioid withdrawal bases.\n• For patients with overdoses reversed by naloxone, calculate a COWS score and consider administration.\n• Calculate a COWS score before and after administration."],
 ["Calcium Chloride", "• Confirm IV is patent prior to administration, as extravasation causes severe tissue necrosis. Avoid use in small veins (feet/hands) for this reason.\n• Precipitates to form calcium carbonate (chalk) when used with sodium bicarbonate. Administer calcium chloride and sodium bicarbonate in separate IV/IO or thoroughly flush in between administrations using at least 10 mL of normal saline.\n• Calcium chloride contains three times more elemental calcium than calcium gluconate does. Constant ECG and vital sign monitoring are essential.\n• Contact base hospital if dose exceeds par level."],
 ["Dextrose", "• Confirm IV is patent prior to administration, as extravasation causes severe tissue necrosis. Use a large vein for administration and monitor the site closely.\n• Immediately stop administration if extravasation occurs; document it and notify the receiving facility staff.\n• Do not administer to patients with stroke unless hypoglycemia is documented.\n• Repeat blood glucose level is required if patient remains on scene (AMA or release) and initial blood glucose level was abnormal.\n• Repeat blood glucose is not indicated enroute if patient status is improving.\n• If D10 not available, can dilute D50 to make D10.\nMixing Instructions (D50 to D10)\n• Remove 50 mL normal saline (NS) from the 250 mL NS bag\n• Add 50 mL of D50 (25 gm/50 mL) to 200 mL NS bag\n• The mixture now has 25 gm/250 mL of dextrose at 10% concentration"],
 ["Diphenhydramine", "• Administer slow IV.\n• Epinephrine is the most important immediate treatment for anaphylaxis and should be administered as soon as anaphylaxis is recognized. The pharmacologic actions address the pathophysiological changes that occur in anaphylaxis better than any other medication. Delayed epinephrine injection is associated with fatalities.\n• May be administered between epinephrine doses in anaphylaxis."],
 ["Epinephrine (1:1,000)", "• EMT: Authorized to administer via auto-injector only.\n• Epinephrine is the most important immediate treatment for anaphylaxis and should be administered as soon as anaphylaxis is recognized. The pharmacologic actions address the pathophysiologic changes that occur in anaphylaxis better than any other medication. Delayed epinephrine injection is associated with fatalities.\n• Inadvertent IV injection of usual IM formulation and dose constitutes a 10-fold overdose that can result in sudden and severe hypertension and cerebral hemorrhage.\n• In patients who remain hypotensive after initial IM epinephrine, administer IV fluids. Have push-dose epinephrine ready for patients unresponsive to repeated IM epinephrine and IV fluids."],
 ["Epinephrine (1:10,000)", "During CPR, epinephrine is administered to increase systemic vasomotor tone, thereby increasing diastolic blood pressure and coronary perfusion pressure."],
 ["Epinephrine (1:100,000)", "• Administer slowly via IV and titrate to adequate perfusion.\n• Patients with anaphylaxis unresponsive to IM epinephrine and aggressive fluid resuscitation may benefit from push-dose epinephrine.\nMixing Instructions\n• Remove 1 mL normal saline (NS) from the 10 mL NS syringe\n• Add 1 mL of epinephrine 1:10,000 (0.1 mg/mL) to 9 mL NS syringe\n• The mixture now has 10 mL of epinephrine at 0.01 mg/mL (10 mcg/mL) concentration"],
 ["Fentanyl", "• Remember to consider non-pharmacologic pain treatments, e.g., place in position of comfort, apply ice packs/splints PRN, and verbal reassurance.\n• Closely monitor respiratory status (including capnography) after administration.\n• An initial dose of 100 mcg IV or 50 mcg IN is well tolerated in most adults.\n• In opioid-naive or elderly patients, start with a lower dose. For elderly patients not taking opioids, 25 mcg is frequently sufficient for pain relief. Consider beginning with 25 mcg and titrating up in increments of 25 mcg to achieve pain relief without respiratory depression.\n• For pediatric patients >36 kg or longer than the LBRT, rather than administering the maximum dose, use weight-based dosing for both initial and repeat doses. It is acceptable to round doses (up or down) to the nearest 5 mcg."],
 ["Glucagon", "• AEMT: Authorized to administer via IM only.\n• Use mixture immediately after reconstitution of dry powder.\n• Patient usually awakens from hypoglycemic coma in 5-20 minutes after glucagon injection. PO carbohydrates should be given as soon as possible after patient regains consciousness and is able to maintain airway.\n• Anticipate nausea/vomiting following administration of glucagon."],
 ["Ipratropium Bromide", "• If concerned about aerosolized infectious exposure, substitute with MDI, if available.\n• Patients may need to be instructed on proper use of the MDI."],
 ["Ketamine", "• Not authorized for sedation.\n• Not authorized for use in dissociative dose ranges. To reduce the risk for dissociative states, maximum total dose administered is not to exceed 60 mg IV or 100 mg IN.\n• Administration results in elevated heart rate and blood pressure. Do not administer to patients who cannot tolerate these changes in vital signs.\n• Rapid administration can result in respiratory and potentially cardiac arrest. Administer slowly.\n• Do not infuse with Ringer’s lactate solution."],
 ["Lidocaine", "• If patient is in unstable ventricular tachycardia, synchronized cardioversion should be performed first.\n• Adult doses should be given in increments rounded (up or down) to the nearest 20 mg amount.\n• Lidocaine jelly may be applied to an ET tube for intubation or on a nasopharyngeal airway."],
 ["Magnesium Sulfate", "• Magnesium sulfate is the antiseizure medication of choice in the setting of preeclampsia/eclampsia. The primary reason for administering magnesium sulfate is to prevent recurrent seizures (i.e., prophylaxis) rather than for control of the initial seizure, which is usually short in duration.\n• Preeclampsia is rare before 20 weeks gestation or after 48 hours post-delivery; however, may occur up to 6 weeks postpartum.\n• Headache or shortness of breath is frequently the presenting symptom of postpartum preeclampsia. Elevated blood pressure is an inconsistent finding.\n• Rarely, eclamptic seizures can present as focal or multifocal seizures.\n• Seizing patients at ≥20 weeks gestation or up to 6 weeks postpartum should be assumed to have eclampsia and treated accordingly.\n• Seizures consistent with other etiologies (e.g., hypoglycemia, alcohol withdrawal, known seizure history) should be treated in addition to eclampsia.\n• If the patient receives too much magnesium, this may result in magnesium toxicity. Symptoms of magnesium toxicity typically appear in this order: loss of deep tendon reflexes, respiratory paralysis, cardiac conduction changes (prolongation of PR, QRS, and QT intervals), then cardiac arrest. Calcium is the antidote and reverses magnesium toxicity.\n• Apply pacing pads to patients with second- or third-degree heart block requiring magnesium."],
 ["Midazolam", "• Closely monitor respiratory status (including capnography) and cardiac function after administration.\n• Sedation prior to cardioversion is recommended. Consider a lower dose with attention to age and hydration status.\n• For severely agitated or combative patients, IN or IM administration is the preferred route to decrease risk of injury to the patient and personnel.\n• Administration in patients with alcohol intoxication can cause respiratory depression. Consider a lower dose or avoiding use."],
 ["Morphine", "• Remember to consider non-pharmacologic pain treatments, e.g., place in position of comfort, apply ice packs/splints PRN, and verbal reassurance.\n• Closely monitor respiratory status (including capnography) after administration."],
 ["Naloxone", "• EMT: Authorized to administer via IN only.\n• AEMT: Authorized to administer via IN/IM only.\n• Not authorized in cardiac arrest.\n• Titrate IV dose to maintain adequate respiratory drive; use only enough to reverse respiratory depression.\n• Duration of opioid effects may exceed that of naloxone; closely monitor patient’s respiratory status.\n• Naloxone may precipitate acute withdrawal symptoms or acute pulmonary edema when given to patients with opioid use disorder.\n• Administration can result in the sudden onset of opiate withdrawal (agitation, tachycardia, pulmonary edema, nausea, vomiting, and, in neonates, seizures)."],
 ["Nitroglycerin", "• EMT: Authorized to assist patient to self-medicate own prescribed NTG only.\n• Examples of erectile dysfunction medications include sildenafil (Viagra), tadalafil (Cialis) and vardenafil (Levitra).\n• Examples of pulmonary hypertension medications include sildenafil (Revatio) and epoprostenol sodium (Flolan, Veletri).\n• Nitroglycerin is used primarily to provide pain relief from anginal chest discomfort.\n• Assess the patient and document vital signs, including pain scale, before and after each administration."],
 ["Ondansetron", "• ECG changes include dose-dependent QT prolongation and ST-segment depression.\n• May cause serotonin syndrome if co-administered with selective serotonin reuptake inhibitors (SSRIs), e.g., fluoxetine, sertraline, citalopram, escitalopram, paroxetine."],
 ["Sodium Bicarbonate", "• Monitor the patient closely for signs and symptoms of fluid overload. Because the buffering action produces carbon dioxide, ensure the patient has adequate airway and ventilatory support.\n• May precipitate or inactivate other medications; flush the IV line well before and after administering sodium bicarbonate. For example, precipitates to form calcium carbonate (chalk) when used with calcium chloride. Administer calcium chloride and sodium bicarbonate in separate IV/IO or thoroughly flush in between administrations using at least 10 mL of normal saline."],
 ["Tranexamic Acid", "• Rapid infusion may cause hypotension; administer over 10 minutes.\n• Slow infusion rate if nausea, vomiting, or near syncope occurs.\n• May increase the risk of thromboembolic disorders."]
];

/* ---------- Store ---------- */
const LS='pdrill:v1';
function freshStore(){ return {settings:{mode:'keys',auto:false,v:3,live:false,mnemView:'book'},progress:{},custom:[],mnem:{},mnemLast:{},streak:{days:[],today:{d:'',k:[]}},runs:{},stamp:{},updatedAt:0}; }
function cleanStore(s){
  const f=freshStore(); if(!s||typeof s!=='object') return f;
  f.settings=Object.assign(f.settings,s.settings||{});
  if(f.settings.prot===undefined) f.settings.prot=true;
  if(f.settings.v!==3){ f.settings.mode='keys'; f.settings.v=3; ['moa','class','ind','dose'].forEach(k=>delete f.progress[k]); }
  if(f.settings.mode!=='exact') f.settings.mode='keys';
  f.progress=(s.progress&&typeof s.progress==='object')?s.progress:{};
  f.custom=Array.isArray(s.custom)?s.custom.filter(d=>d&&d.id&&typeof d.src==='string'):[];
  f.mnem=(s.mnem&&typeof s.mnem==='object')?s.mnem:{};
  f.mnemLast=(s.mnemLast&&typeof s.mnemLast==='object')?s.mnemLast:{};
  if(s.streak&&typeof s.streak==='object'){ f.streak.days=Array.isArray(s.streak.days)?s.streak.days.filter(d=>typeof d==='string'):[]; if(s.streak.today&&typeof s.streak.today.d==='string'&&Array.isArray(s.streak.today.k)) f.streak.today={d:s.streak.today.d,k:s.streak.today.k.slice()}; }
  if(s.runs&&typeof s.runs==='object') for(const k in s.runs){ const r=s.runs[k]; if(r&&typeof r==='object'&&(typeof r.gone==='number'||Array.isArray(r.ids))) f.runs[k]=r; }
  if(s.stamp&&typeof s.stamp==='object') for(const k in s.stamp) if(typeof s.stamp[k]==='number') f.stamp[k]=s.stamp[k];
  f.updatedAt=+s.updatedAt||0; return f;
}
let store=freshStore();
try{ store=cleanStore(JSON.parse(localStorage.getItem(LS)||'null')); }catch(e){}
function persistLocal(){ try{ localStorage.setItem(LS,JSON.stringify(store)); }catch(e){} }
function touch(){ stampParts(); store.updatedAt=Date.now(); persistLocal(); scheduleRemote(); }

/* Keeping devices in step. Each part of your progress (each deck's record, settings, custom decks, mnemonics)
   remembers when it last changed, and so does each run in progress, so two copies (this device and your account)
   merge part by part: the newer part wins, and streak days from both are kept. */
const partsOf=st=>{ const o={settings:st.settings,custom:st.custom,mnem:st.mnem,mnemLast:st.mnemLast}; for(const k in st.progress) o['p:'+k]=st.progress[k]; return o; };
let partSnap={};
function snapParts(){ partSnap={}; const ps=partsOf(store); for(const k in ps) partSnap[k]=JSON.stringify(ps[k]); }
function stampParts(){ const now=Date.now(), ps=partsOf(store); for(const k in ps){ const j=JSON.stringify(ps[k]); if(partSnap[k]!==j){ store.stamp[k]=now; partSnap[k]=j; } } }
const runT=r=>r?(r.gone||r.t||0):-1;
function mergeStores(a,b){   // a: this device, b: the other copy
  const m=cleanStore(JSON.parse(JSON.stringify(a)));
  let aNewer=false, bNewer=false;
  const pa=partsOf(a), pb=partsOf(b), sa=a.stamp||{}, sb=b.stamp||{};
  for(const k of new Set([...Object.keys(pa),...Object.keys(pb)])){
    const ja=k in pa?JSON.stringify(pa[k]):null, jb=k in pb?JSON.stringify(pb[k]):null;
    if(ja===jb) continue;
    let ta=ja==null?-1:(sa[k]||0), tb=jb==null?-1:(sb[k]||0);
    if(ta===tb){ ta=a.updatedAt||0; tb=b.updatedAt||0; }   // older saves without change times: the newer copy wins
    if(tb>ta){ const v=JSON.parse(jb); if(k.startsWith('p:')) m.progress[k.slice(2)]=v; else m[k]=v; if(sb[k]) m.stamp[k]=sb[k]; bNewer=true; }
    else aNewer=true;
  }
  for(const k of new Set([...Object.keys(a.runs||{}),...Object.keys(b.runs||{})])){
    const ra=(a.runs||{})[k], rb=(b.runs||{})[k], ta=runT(ra), tb=runT(rb);
    if(tb>ta){ m.runs[k]=JSON.parse(JSON.stringify(rb)); bNewer=true; } else if(ta>tb) aNewer=true;
  }
  const da=new Set(a.streak.days), db=new Set(b.streak.days);
  if([...db].some(d=>!da.has(d))||(b.streak.today.d===a.streak.today.d&&b.streak.today.k.some(x=>!a.streak.today.k.includes(x)))||b.streak.today.d>a.streak.today.d) bNewer=true;
  if([...da].some(d=>!db.has(d))||(b.streak.today.d===a.streak.today.d&&a.streak.today.k.some(x=>!b.streak.today.k.includes(x)))||a.streak.today.d>b.streak.today.d) aNewer=true;
  mergeStreak(m,b);
  m.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return {m,aNewer,bNewer};
}
// Take in a merged copy. If the run on screen moved on elsewhere, show where it is now.
function adoptStore(m){
  const live=run&&!run.one&&ui.screen==='drill'?run.deckId:null, before=live?runT(store.runs[live]):null;
  store=m; snapParts(); persistLocal();
  if(live&&runT(store.runs[live])!==before){
    const r=store.runs[live], deck=curDeck();
    if(r&&!r.gone&&deck&&r.sig===sig(deck)) run=JSON.parse(JSON.stringify(r));
    else { run=null; ui.screen=deck&&deck.card?'cards':'home'; }
    render(); return;
  }
  if(ui.screen==='home'||ui.screen==='cards'||ui.screen==='about') render();
}

/* Daily streak: a day counts once you've answered 3 different things with no mistakes that day
   (a card in any deck, or a section of a drug card). Days are your phone's calendar days. */
const STREAK_MIN=3;
function dayKey(t){ const d=t==null?new Date():new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function logLearned(id){
  const st=store.streak, d=dayKey();
  if(st.today.d!==d) st.today={d,k:[]};
  if(st.today.k.includes(id)) return;
  st.today.k.push(id);
  if(st.today.k.length>=STREAK_MIN&&!st.days.includes(d)){ st.days.push(d); st.days.sort(); if(st.days.length>1500) st.days=st.days.slice(-1500); }
  touch();
}
function streakNow(){
  const st=store.streak, set=new Set(st.days), today=dayKey();
  const doneToday=set.has(today); const dt=new Date(); dt.setHours(12,0,0,0);
  if(!doneToday) dt.setDate(dt.getDate()-1);   // today isn't over yet: the streak runs through yesterday
  let n=0; while(set.has(dayKey(dt))){ n++; dt.setDate(dt.getDate()-1); }
  return {n,doneToday,today:st.today.d===today?st.today.k.length:0};
}
// Two copies of your progress (this device and your account): keep every streak day from both.
function mergeStreak(into,from){
  if(!from||!from.streak) return;
  into.streak.days=[...new Set(into.streak.days.concat(from.streak.days||[]))].sort().slice(-1500);
  const a=into.streak.today, b=from.streak.today;
  if(b&&b.d){ if(a.d===b.d) a.k=[...new Set(a.k.concat(b.k))]; else if(b.d>a.d) into.streak.today={d:b.d,k:b.k.slice()}; }
}
let shownDay=dayKey();

/* Account sync: per-person document, private to the viewer. Falls back to this browser only. */
let remote=null, saveTimer=null, saving=false, again=false, seenRemote=0;
function scheduleRemote(){ if(!remote) return; clearTimeout(saveTimer); saveTimer=setTimeout(flushRemote,1200); }
async function readRemote(){ const sn=await remote.get(); return sn.exists?cleanStore(JSON.parse(JSON.stringify(sn.data()||{}))):null; }
function absorb(r){ seenRemote=Math.max(seenRemote,r.updatedAt); const x=mergeStores(store,r); if(x.bNewer) adoptStore(x.m); return x; }
async function flushRemote(){
  clearTimeout(saveTimer); saveTimer=null;
  if(!remote) return; if(saving){again=true;return;}
  saving=true;
  try{
    const r=await readRemote(); if(r&&r.updatedAt>seenRemote) absorb(r);   // never overwrite what another device saved
    await remote.set(JSON.parse(JSON.stringify(store))); seenRemote=Math.max(seenRemote,store.updatedAt);
  }
  catch(e){ const c=e&&e.code; if(c!=='unavailable'&&c!=='resource_exhausted'){ remote=null; updateSync(); } }
  saving=false; if(again){again=false; flushRemote();}
}
async function pullRemote(){
  if(!remote||saving) return;
  try{ const r=await readRemote(); if(!r||r.updatedAt<=seenRemote) return; const x=absorb(r); if(x.aNewer) scheduleRemote(); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pullRemote(); else if(remote&&saveTimer) flushRemote(); });
window.addEventListener('focus',()=>pullRemote());
setInterval(()=>{ if(document.visibilityState==='visible') pullRemote(); },30000);
async function initRemote(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/state');
    remote=ref;
    const r=await Promise.race([readRemote(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
    if(r){ const x=absorb(r); if(x.aNewer) scheduleRemote(); }
    else if(store.updatedAt) scheduleRemote();
    updateSync();
  }catch(e){ remote=null; }
}
function updateSync(){ const el=document.getElementById('syncNote'); if(el) el.textContent=remote?'Your decks and progress are saved to your Claude account.':'Your decks and progress are saved in this browser.'; }

/* ---------- Decks ---------- */
function parseSrc(src){
  const items=[]; let skipped=0;
  String(src||'').split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t||t.startsWith('#')) return;
    let i=t.indexOf('::'), sep=2; if(i<0){ i=t.indexOf('\t'); sep=1; }
    if(i<=0){ skipped++; return; }
    const d=t.slice(0,i).trim(), a=t.slice(i+sep).trim();
    if(!d||!a){ skipped++; return; }
    items.push({d,a});
  });
  return {items,skipped};
}
function customDeck(c){ return {id:c.id,title:c.title,short:c.title,ask:c.ask||'Answer',ph:'Type the answer',unit:'cards',items:parseSrc(c.src).items,custom:true}; }
const BY_ID={}; BUILTIN.forEach(d=>{ BY_ID[d.id]=d; d.items.forEach(it=>{ it.sec=d.id; }); });
// Drug cards: every section of one P-115 card, in card order.
const DRUGS=IND.map(r=>r[0]).slice().sort((x,y)=>x.localeCompare(y));
const baseOf=n=>n.startsWith('Epinephrine')?'Epinephrine':n;
const CARD_ORDER=['class','moa','ind','contra','dose','peds','adv','notes'];
const CARD_CACHE=new Map();
function cardDeck(name){
  if(CARD_CACHE.has(name)) return CARD_CACHE.get(name);
  const base=baseOf(name);
  const pick=(id,d)=>BY_ID[id].items.filter(it=>it.d===d);
  const items=[];
  CARD_ORDER.forEach(id=>{
    let got;
    if(id==='moa'&&name==='Albuterol / Levalbuterol') got=pick('moa','Albuterol').concat(pick('moa','Levalbuterol'));
    else if(['class','moa','contra','adv'].includes(id)) got=pick(id,base);
    else got=pick(id,name);
    got.forEach(it=>items.push(Object.assign({},it)));
  });
  const deck={id:'card:'+name,title:name,short:splitName(name).name,ask:'',ph:'Type the answer',unit:'sections',items,card:true,ordered:true};
  CARD_CACHE.set(name,deck); return deck;
}
function decks(){ return BUILTIN.concat(store.custom.map(customDeck)); }
function deckById(id){
  if(id&&id.startsWith('card:')){ const n=id.slice(5); return DRUGS.includes(n)?cardDeck(n):null; }
  return decks().find(d=>d.id===id)||null;
}
const secOf=(item,deck)=>(item.sec&&BY_ID[item.sec])||deck;
function sig(deck){ let h=5381; const s=deck.items.map(i=>i.d+'\u0000'+(i.c||'')+'\u0000'+i.a).join('\u0001'); for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return String(h); }

// Every deck and drug card:
// - Before Learned the bar shows "x% learned": cards right the first time in your most recent full run.
// - One perfect full run (no misses, nothing coming back) = Learned, and the mastery bar starts at 10%.
//   Each perfect run in a row adds 10%; 10 in a row = Mastered. A failed run sets the mastery bar to 0%.
// - A run fails at its first miss (counted right then, so restarting doesn't undo it). 2 failed runs in a row:
//   Mastered drops to Learned (bar at 0%), Learned drops to 0. A perfect run in between clears the first strike.
// - 169 hours without finishing a full run resets the deck to 0; the last 24 hours show a red countdown.
const MASTER_RUNS=10, COUNTDOWN_FROM=3, FAIL_LIMIT=2;
const RESET_MS=169*3600e3, WARN_MS=24*3600e3;
function progOf(id){
  const p=store.progress[id]||{};
  const streak=p.streak!=null?p.streak:(p.runs&&p.lastMisses===0?1:0);
  const mastered=!!p.mastered;
  const learned=mastered||(p.learned!=null?!!p.learned:streak>=1);
  let lastPct=p.lastPct;
  if(lastPct==null&&p.runs){ const d=deckById(id); const n=d?d.items.length:0; lastPct=n?Math.max(0,Math.round((n-(p.lastMisses||0))/n*100)):0; }
  return {streak,learned,mastered,strikes:p.strikes||0,runs:p.runs||0,lastMisses:p.lastMisses,lastPct:lastPct||0,lastAt:p.lastAt||0};
}
const hasProg=cp=>cp.learned||cp.mastered||cp.streak>0||cp.lastPct>0;
// The stored record, with older saves filled in.
function progRec(id){
  const cp=progOf(id); const p=store.progress[id]||(store.progress[id]={runs:0,perfect:0});
  p.streak=cp.streak; p.learned=cp.learned; p.mastered=cp.mastered; p.strikes=cp.strikes; p.lastPct=cp.lastPct; delete p.slips;
  return p;
}
function failRun(p){
  p.strikes=(p.strikes||0)+1; p.streak=0;
  if(p.mastered){ if(p.strikes>=FAIL_LIMIT){ p.mastered=false; p.learned=true; p.strikes=0; } }
  else if(p.learned){ if(p.strikes>=FAIL_LIMIT){ p.learned=false; p.strikes=0; } }
  else p.strikes=0;
}
function decayAll(){
  const now=Date.now(); let changed=false;
  for(const id of Object.keys(store.progress)){
    const cp=progOf(id); if(!hasProg(cp)) continue; const p=store.progress[id];
    if(!cp.lastAt){ p.lastAt=now; changed=true; continue; }
    if(now-cp.lastAt>=RESET_MS){ Object.assign(p,{learned:false,mastered:false,streak:0,strikes:0,lastPct:0,resetAt:now}); delete p.slips; changed=true; }
  }
  if(changed) touch();
}
const fmtLeft=ms=>{ const t=Math.max(0,Math.ceil(ms/1000)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=t%60; return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; };
function timerHTML(id){
  const cp=progOf(id); if(!hasProg(cp)||!cp.lastAt) return '';
  const end=cp.lastAt+RESET_MS, left=end-Date.now(); if(left>WARN_MS||left<=0) return '';
  return `<span class="reset-timer" data-end="${end}" title="Progress resets to 0 when this runs out. Finish a run to restart the clock."><span class="sr-only">Resets in </span>${fmtLeft(left)}</span>`;
}
setInterval(()=>{
  if(dayKey()!==shownDay){ shownDay=dayKey(); if(ui.screen==='home') render(); }
  const els=document.querySelectorAll('.reset-timer[data-end]'); if(!els.length) return; let expired=false;
  els.forEach(el=>{ const left=+el.dataset.end-Date.now(); if(left<=0) expired=true; const v=el.lastChild; if(v) v.textContent=fmtLeft(left); });
  if(expired&&(ui.screen==='home'||ui.screen==='cards')) render();
},1000);
function progStatus(deck){
  const cp=progOf(deck.id); const r=loadRun(deck); const chips=[];
  if(r) chips.push(`<span class="chip prog">In progress \u00b7 ${r.cleared.length}/${r.ids.length}${r.subset?' missed':''}</span>`);
  if(cp.mastered) chips.push('<span class="chip gold">Mastered</span>');
  else if(cp.learned){
    chips.push('<span class="chip ok">Learned</span>');
    const left=MASTER_RUNS-cp.streak;
    if(left<=COUNTDOWN_FROM&&left>0) chips.push(`<span class="chip prog">${left} attempt${left===1?'':'s'} from mastery</span>`);
  }
  if(!cp.learned&&cp.lastPct>0&&cp.lastMisses>0) chips.push(`<span class="chip miss">Last run: ${cp.lastMisses} missed</span>`);
  if(!r&&!cp.runs&&!cp.mastered) chips.push('<span class="chip">Not started</span>');
  return chips.join('');
}
function progIcon(id){

}

// (and a revealed next word still fits it). A draft only comes back for the same card and step it was typed on.
const draftKey=()=>[run.cur,run.phase,(run.fix&&run.fix.i)||0,pres().redo?1:0].join('|');

/* Two drugs on one card: a box per drug with its name in front, so you never type the names. What you type is
   written into the answer box behind the scenes as "• Name: …" lines, so checking, the mistake warning, next word
   and saving work as for any card. A section about one drug of a two-drug card (Albuterol / Levalbuterol's
   mechanisms) shows that drug's name over the box. */
const DRUG_WORDS=new Set(DRUGS.flatMap(n=>n.replace(/\([^)]*\)/g,' ').split(/[\s\/-]+/)).filter(w=>/^[A-Z][a-z]/.test(w)).map(w=>w.toLowerCase()));
function drugParts(item){
  if(!item||typeof item.a!=='string') return null;
  const labels=[];
  for(const ln of item.a.split('\n')){ const m=/^\s*•\s*([A-Z][A-Za-z]+):\s/.exec(ln); if(!m||!DRUG_WORDS.has(m[1].toLowerCase())) return null; labels.push(m[1]); }
  return labels.length>=2&&new Set(labels).size===labels.length?labels:null;
}
function drugLabel(item,deck){ return deck&&deck.card&&/\s\/\s/.test(deck.title)&&item&&item.d!==deck.title?item.d:''; }
function composeDrugs(labels,vals){
  let last=-1; vals.forEach((v,i)=>{ if(v.trim()) last=i; });
  return labels.slice(0,last+1).map((l,i)=>'• '+l+': '+vals[i].replace(/\n/g,' ').replace(/^\s+/,'')).join('\n');
}
function decomposeDrugs(labels,text){
  const vals=labels.map(()=>''); let cur=-1;
  String(text||'').split('\n').forEach(ln=>{
    const m=/^\s*•?\s*([A-Za-z]+):\s?(.*)$/.exec(ln); const i=m?labels.findIndex(l=>l.toLowerCase()===m[1].toLowerCase()):-1;
    if(i>=0){ cur=i; vals[i]=m[2]; } else if(ln.trim()){ const j=cur<0?0:cur; vals[j]+=(vals[j]?' ':'')+ln.replace(/^\s*•\s*/,''); }
  });
  return vals;
}

  const bx=[...wrap.querySelectorAll('.db-box')];

  bx.forEach(b=>{ b.readOnly=ans.readOnly; b.placeholder=ans.readOnly?'':ans.placeholder&&/part/i.test(ans.placeholder)?'Type the part for this drug, if any':'Type here'; b.classList.toggle('good',ans.classList.contains('good')); });
