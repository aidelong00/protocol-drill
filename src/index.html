// bold: the answer at the top while you retype a part below it; mistakes are bold there, and only the part you retype is highlighted.
function answerHTML(item,g,bold){
  // (extra words you typed aren't inserted into the answer as "+word": the "Missing or wrong" line names them)
  const word=p=>{
    const bad=(p.req&&!p.ok)||p.bad;
    return bad?(bold?`<b class="xb">${esc(p.w)}</b>`:`<span class="w miss">${esc(p.w)}</span>`):p.ord&&!bold?`<span class="w ord">${esc(p.w)}</span>`:esc(p.w);
  };
  return g.res.map(r=>{
    if(r.k) return bold?`<mark class="k${r.ok?' ok':''}">${esc(r.disp)}</mark>`:`<mark class="k ${r.ok?'ok':'miss'}">${esc(r.disp)}</mark>`;
    if(r.parts) return r.parts.map(word).join('');
    return esc(r.text);
  }).join('');
}

// Everything to fix is one step with one Check: the part(s) of the answer (or the whole answer) and the protocols.
// Two parts are typed one after the other ("…" between them in the box).
function normFix(f){
  if(!f||f.full) return {targets:[{kind:'full'}],i:0};
  let t=f.targets.slice(Math.min(f.i||0,Math.max(0,f.targets.length-1))).map(t=>t.kind?t:{kind:'part',text:t.text});
  const wantProt=!run||needProt(curItem());
  if(t.some(x=>x.kind==='memory')) return {targets:[t.find(x=>x.kind==='memory')],i:0};
  const prot=wantProt&&t.some(x=>x.kind==='prot'||x.prot);
  const parts=[]; t.forEach(x=>{ if(x.kind==='part') (x.texts||[x.text]).forEach(y=>parts.push(y)); });
  let m;
  if(t.some(x=>x.kind==='full')) m={kind:'full'};
  else if(parts.length) m={kind:'part',text:parts.join(' … '),texts:parts,n:parts.length};
  else if(prot) return {targets:[{kind:'prot'}],i:0};
  else m={kind:'full'};
  if(prot) m.prot=true;
  return {targets:[m],i:0};
}
function protHTML(item,res,bold){
  const miss=new Set(res?res.missing:[]);
  return item.p.map(s=>miss.has(s)?(bold?`<b class="nw xb">${esc(s)}</b>`:`<span class="nw w miss">${esc(s)}</span>`):`<span class="nw">${esc(s)}</span>`).join(', ');
}
// Typing from memory: the first answer, a redo after a miss, or a restart after being stopped.
const fromMemory=()=>run.phase==='answer'||(run.phase==='retype'&&normFix(run.fix).targets[normFix(run.fix).i].kind==='memory');

/* Catch mistakes as you type */
function onType(){
  if(!run) return;
  syncDraft(); saveRun();
  if(run.phase==='retype'&&!fromMemory()){ paintFeedback(); return; }
  paintLive();
}
function paintLive(){
  const w=document.getElementById('liveWarn'); if(!w) return;
  const on=!!store.settings.live&&fromMemory();
  if(!on){ w.hidden=true; ans.classList.remove('warnb'); return; }
  const lc=liveCheck(curItem(),ans.value,store.settings.mode);
  if(lc.state==='stop'){ liveStop(lc); return; }
  // Only a warning that actually shows makes the card a miss (unless warnings are set not to count);
  // a clean answer with the switch on still counts. Being stopped is always a miss.
  if(lc.state==='warn'&&run.phase==='answer'&&!pres().assisted&&store.settings.warnMiss!==false){ pres().assisted=true; saveRun(); }
  w.hidden=lc.state!=='warn'; ans.classList.toggle('warnb',lc.state==='warn');
}
// Stopping partway (Show answer, or Check while the mistake warning is showing) isn't finishing: only what you've
// typed is graded, the part you haven't reached yet isn't a mistake, and you keep going from where you left off.
function partialInfo(item,text,mode){
  if(!item||item.any||item.none||item.na||typeof item.a!=='string'||parseAnswer(item.a).some(s=>s.k)) return null;
  const g=gradeItem(item,text,mode); if(g.pass||!g.res||g.res.length!==1||!g.res[0].parts) return null;
  // where you got to: the same nearby-first reading as "Show next word" (a word that comes again later doesn't count)
  const ref=refOf(item.a,item.phr), lee=LEEWAY[mode], O=optsOf(item);
  const req=[]; ref.toks.forEach((x,i)=>{ if(!lee.has(x.t)&&!x.opt&&!andSkips(ref,O,i)) req.push(i); });
  const R=req.map(i=>effRef(ref.toks[i].t,O)), U=userToks(text,ref,lee,O);
  const last=nearLast(R,U); if(last<0||R.length-1-last<=2) return null;   // you reached the end: that's a normal check
  const tk=ref.toks[req[last]], pos=Math.max(...(tk.wis||[tk.wi]));
  // grade what you typed against the answer up to there; nothing after it is marked
  const pg=gradePlain(ref.parts.slice(0,pos+1).join(''),text,mode==='exact'?'exact':'keys',O);
  const shown=JSON.parse(JSON.stringify(g)); let wrong=0;
  shown.res[0].parts.forEach((q,i)=>{
    const r=i<=pos&&pg.res&&pg.res[0]&&pg.res[0].parts?pg.res[0].parts[i]:null;
    if(r){ q.ok=r.ok; q.bad=r.bad; q.ord=r.ord; if(r.x) q.x=r.x; else delete q.x; if(r.px) q.px=r.px; else delete q.px; if((q.req&&!q.ok)||q.bad||q.x||q.px) wrong++; }
    else { q.ok=true; q.bad=false; q.ord=false; delete q.x; delete q.px; }
  });
  return {shown,wrong};
}
function cutOff(){
  countMiss(); pres().nw=null;
  run.phase='retype'; run.retried=false;
  run.fix={targets:[{kind:'memory'}],i:0};
  run.last={text:ans.value,missing:[],prot:protEl().value,cutoff:true};
  saveRun(); paint(); focusActive();
  try{ ans.setSelectionRange(ans.value.length,ans.value.length); }catch(e){}
  const fb=document.getElementById('fb'); if(fb&&fb.scrollIntoView) fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function liveStop(lc){
  countMiss(); pres().nw=null;
  const keep=ans.value.slice(0,lc.cut).replace(/\s+$/,'');
  run.phase='retype'; run.retried=false;
  run.fix={targets:[{kind:'memory'}],i:0};
  run.last={text:ans.value,missing:[],prot:protEl().value,stop:lc.msg,mark:lc.mark,kept:!!keep};
  ans.value=keep?keep+' ':''; saveRun(); paint(); shake(ans);
  try{ ans.focus({preventScroll:true}); ans.setSelectionRange(ans.value.length,ans.value.length); }catch(e){}
  const fb=document.getElementById('fb'); if(fb&&fb.scrollIntoView) fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}

// A stop shows the answer with what went wrong in bold (left out, wrong word, or "+word" where a stray word went),
// and what you typed with your stray or wrong word in bold.
function stopHTML(item,last){
  const m=last.mark; if(!m) return `<p class="fb-ans">${esc(last.stop||'')}</p>`;
  const ref=refOf(item.a,item.phr); const B=new Set(); (m.b||[]).forEach(([a,b])=>{ for(let i=a;i<=b;i++) B.add(i); });
  let h='';   // (a stray word shows in bold in "You wrote", not as "+word" in the answer)
  ref.parts.forEach((w,i)=>{ const t=esc(w); h+=B.has(i)&&w.trim()?`<b class="xb">${t}</b>`:t; });
  const raw=last.text||''; let u='', at=0;
  (m.u||[]).slice().sort((p,q)=>p[0]-q[0]).forEach(([a,b])=>{ if(a<at) return; u+=esc(raw.slice(at,a))+`<b class="xb">${esc(raw.slice(a,b))}</b>`; at=b; });
  u+=esc(raw.slice(at));
  return `<p class="fb-ans">${h}</p>${raw.trim()?`<p class="fb-small">You wrote: ${u.trim()}</p>`:''}`;
}

/* Mnemonic panel (adverse effects) */
function mnView(item){
  const p=pres(); if(p.mnView) return p.mnView;
  const mine=store.mnem&&store.mnem[item.d]; const last=store.mnemLast&&store.mnemLast[item.d];
  if(last&&(last!=='mine'||mine)) return last;   // the view you last used for this drug
  return mine?'mine':(store.settings.mnemView||'book');
}
function rememberView(d,v){ store.mnemLast=store.mnemLast||{}; if(v==null){ if(d in store.mnemLast){ delete store.mnemLast[d]; touch(); } return; } if(store.mnemLast[d]!==v){ store.mnemLast[d]=v; touch(); } }
// Adverse effects are shown in the order of the mnemonic view in use (grading is any order either way).
function shownItem(item){
  if(!item.mn) return item;
  const list=mnemonicOrder(item.mn,mnView(item),store.mnem&&store.mnem[item.d]);
  return list.join('\n')===item.mn.join('\n')?item:Object.assign({},item,{a:'\u2022 '+list.join('\n\u2022 ')});
}
function paintMnem(){
  const panel=document.getElementById('mnPanel'); const item=curItem();
  if(!item.mn||!pres().mn||run.phase!=='answer'){ panel.hidden=true; panel.innerHTML=''; return; }
  const v=mnView(item); const mine=(store.mnem&&store.mnem[item.d])||'';
  const tab=(k,l)=>`<button role="radio" aria-checked="${v===k}" data-act="mnview" data-v="${k}">${l}</button>`;
  let body;
  if(v==='mine'&&mine&&!pres().mnEdit) body=`<p class="mn-text">${esc(mine)}</p><button class="link" data-act="mnedit">Edit my mnemonic</button>`;
  else if(v==='mine') body=`<label for="mnInput" class="sr-only">Your mnemonic</label><input type="text" id="mnInput" value="${esc(mine)}" placeholder="Write a mnemonic that helps you" autocomplete="off"><div class="actions"><button class="btn small" data-act="mnsave">Save mnemonic</button>${mine?'<button class="btn small" data-act="mndelete">Delete</button>':''}</div>`;
  else body=`<p class="mn-letters">${esc(mnemonicLetters(item.mn,v==='az'))}</p><p class="fb-small">${item.mn.length} adverse effect${item.mn.length===1?'':'s'}, first letter of each${v==='az'?', A–Z':', in book order'}.</p>`;
  panel.innerHTML=`<div class="seg small" role="radiogroup" aria-label="Mnemonic view">${tab('book','Book order')}${tab('az','A–Z')}${tab('mine','Mine')}</div>${body}`;
  panel.hidden=false;
}

function paintFeedback(){
  const fb=document.getElementById('fb'); const item=curItem(); const mode=store.settings.mode;
  const note=item.n?`<p class="fb-note">${esc(item.n)}</p>`:'';
  const p=pres();
  if(run.phase==='answer'){
    fb.innerHTML=p.redo?`<div class="fb redo"><div class="fb-head">Now from memory</div><p class="fb-small">Type the whole answer again without looking. It still comes back later in this card.</p></div>`:'';
    return;
  }
  if(run.phase==='correct'){
    const g=gradeItem(item,run.last.text,mode);
    const ord=g.order&&g.order.length?`<p class="fb-order"><b>Watch the word order.</b> P-115 says: ${g.order.map(o=>'“'+esc(o)+'”').join(', ')}</p>`:'';
    const prot=item.p?`<p class="fb-prot"><b>Protocols:</b> ${esc(item.p.join(', '))}</p>`:'';
    const hinted=run.last.hinted, assisted=run.last.assisted;
    const head=hinted?'Correct, with a hint':assisted?'Correct, assisted':ord?'Correct, but check the order':'Correct';
    const assistNote=assisted&&!hinted?'<p class="fb-small">You got a \u201cSomething\u2019s off\u2026\u201d warning on this card, so it counts as a miss. Cards only count when you answer without one.</p>':'';
    const hk=run.last.hintKind; const used=hk==='mnemonic'?'the mnemonic':hk==='both'?'the mnemonic and “Show next word”':'“Show next word”';
    const hintNote=hinted?`<p class="fb-small">You used ${used}, so this counts as a miss and comes back later.${run.redoNext?' Next: type it once more from memory.':''}</p>`:'';
    const si=shownItem(item);
    fb.innerHTML=`<div class="fb ${hinted||assisted?'redo':'ok'}"><div class="fb-head">${head}</div><p class="fb-ans">${si===item?answerHTML(item,g):answerHTML(si,gradeItem(si,run.last.text,mode))}</p>${prot}${ord}${hintNote}${assistNote}${note}</div>`;
    return;
  }
  const fx=normFix(run.fix); const cur=fx.targets[fx.i];
  if(cur.kind==='memory'&&run.last.cutoff){
    const info=partialInfo(item,run.last.text,mode);
    const shownHTML=info?answerHTML(item,info.shown,true):answerHTML(item,gradeItem(item,run.last.text,mode),true);
    const what=info&&info.wrong?'Fix the bold part, then keep going from where you left off.':'Keep going from where you left off.';
    fb.innerHTML=`<div class="fb miss"><div class="fb-head">Answer</div><p class="fb-ans">${shownHTML}</p>${run.last.text.trim()?`<p class="fb-small">You wrote: ${esc(run.last.text)}</p>`:''}<p class="fb-small"><b>${what}</b> This counts as a miss and the card comes back later.</p></div>`;
    return;
  }
  if(cur.kind==='memory'){
    const live=ans&&ans.value.trim()?ans.value:'';
    fb.innerHTML=`<div class="fb miss"><div class="fb-head">Stopped</div>${stopHTML(item,run.last)}<p class="fb-small"><b>${run.last.kept?'Pick up from the start of that sentence, from memory.':'Start over from the beginning, from memory.'}</b> This counts as a miss and the card comes back later.</p>${live?'':''}</div>`;
    return;
  }
  const typed=!!(run.last.text.trim()||(run.last.prot||'').trim());
  const lg=gradeItem(item,run.last.text,mode);
  const mainN=lg.pass?0:(lg.special?1:Math.max(1,(lg.mistakes||[]).length));
  const protWrong=(cur.kind==='prot'||cur.prot)&&typed;
  const n=mainN+(protWrong?1:0);
  const live=ans&&!ans.readOnly&&ans.value.trim()?ans.value:'';
  const shown=cur.kind==='full'&&live?gradeItem(item,live,mode):lg;
  let head='Answer';
  if(typed){
    const what=(cur.kind==='part'?(cur.n>1?'fix these parts':'fix just this part'):cur.kind==='prot'?'fix the protocols':'retype the whole answer')+(cur.prot?' and the protocols':'');
    head=`${n===1?'1 mistake':n+' mistakes'}: ${what}`;
  }
  const mainMissing=run.last.text.trim()&&!lg.pass?lg.missing:[];
  const pr=needProt(item)&&typed?gradeProt(item.p,run.last.prot||''):null;
  const protMissing=pr&&!pr.pass?[pr.missing.length?`${pr.missing.length} protocol${pr.missing.length===1?'':'s'} missing`:'',pr.extra.length?`extra protocol ${pr.extra.join(', ')}`:''].filter(Boolean):[];
  const allMissing=mainMissing.concat(protMissing);
  const list=allMissing.length?`<p class="fb-small">Missing or wrong: ${esc(allMissing.slice(0,10).join(', '))}${allMissing.length>10?'…':''}</p>`:'';
  const you=run.last.text.trim()?`<p class="fb-small">You wrote: ${esc(run.last.text)}${needProt(item)?` · Protocols: ${esc(run.last.prot||'')}`:''}</p>`:'';
  const over=typed&&!run.retried?`<button class="link" data-act="override">Count my answer as correct (the grader missed a synonym)</button>`:'';
  const ordMiss=run.last.text.trim()&&lg.orderFail&&lg.order&&lg.order.length?`<p class="fb-order"><b>Out of order.</b> P-115 says: ${lg.order.map(o=>'“'+esc(o)+'”').join(', ')}</p>`:'';
  const top=cur.kind!=='full';   // retyping just a part or the protocols: that box is highlighted, the full answer above is bold
  const protLine=item.p?`<p class="fb-prot"><b>Protocols:</b> ${protHTML(item,pr,top)}</p>`:'';
  const protBox=item.p?`<div class="fix"><div class="fix-label">Retype protocols</div><p class="fix-text">${protHTML(item,gradeProt(item.p,protEl().value||''))}</p><p class="fb-small">Numbers only is fine.</p></div>`:'';
  const redoNote=curDeck().card?'<p class="fb-small">After this, you’ll type the whole section once more from memory.</p>':'';
  let task;
  if(cur.kind==='part'){
    const tg=grade(cur.text,live||run.last.text,mode,optsOf(item));
    task=`<div class="fix"><div class="fix-label">${cur.n>1?'Retype these parts, in order':'Retype'}</div><p class="fix-text">${answerHTML({a:cur.text},tg)}</p></div>`;
  } else if(cur.kind==='prot') task=protBox;
  else task=`<p class="fb-small"><b>Type the whole answer${cur.prot?' and the protocols':''} to continue.</b></p>`;
  const protTask=cur.prot?protBox:'';
  const si=shownItem(item); const shownHTML=si===item?answerHTML(item,shown,top):answerHTML(si,gradeItem(si,cur.kind==='full'&&live?live:run.last.text,mode),top);
  // After a Check that didn't pass: say what's still wrong (it's also marked in the text).
  let still='';
  let protTaskOut=protTask;
  if(p.fail){
    let why=[], whyP=[];
    if(cur.kind==='prot'||cur.prot){ const g2=gradeProt(item.p,protEl().value||''); if(!g2.pass){ whyP=g2.missing.map(x=>x+' missing').concat(g2.extra.map(x=>'extra '+x)); if(!whyP.length) whyP=['type the protocol numbers']; } }
    if(cur.kind!=='prot'){ const tx=ans.value; const g2=cur.kind==='part'?grade(cur.text,tx,mode,optsOf(item)):gradeItem(item,tx,mode); if(!g2.pass) why=g2.missing.length?g2.missing:['check the highlighted words']; }
    const line=w=>w.length?`<p class="fb-still">Still not right: ${esc(w.slice(0,10).join(', '))}${w.length>10?'…':''}</p>`:'';
    if(cur.kind==='prot') task=task.replace(/<\/div>$/,line(whyP)+'</div>');
    else {
      if(cur.kind==='part') task=task.replace(/<\/div>$/,line(why)+'</div>'); else still=line(why);
      if(cur.prot) protTaskOut=protTask.replace(/<\/div>$/,line(whyP)+'</div>');
    }
  }
  fb.innerHTML=`<div class="fb miss"><div class="fb-head">${head}</div>${list}<p class="fb-ans">${shownHTML}</p>${still}${protLine}${ordMiss}${you}${note}${task}${protTaskOut}${redoNote}${over}</div>`;
}

function paint(){
  const deck=curDeck(); const item=curItem(); const sd=secOf(item,deck); const total=run.ids.length; const p=pres();
  document.getElementById('barFill').style.width=(run.cleared.length/total*100)+'%';
  document.getElementById('barTxt').innerHTML=`<b>${run.cleared.length}</b> of ${total} ${deck.card?'sections ':''}cleared`;
  document.getElementById('missTxt').textContent=`${run.misses} missed`;
  const title=deck.card?deck.title:item.d;
  const nm=splitName(title);
  const drug=document.getElementById('drug');
  if(deck.card){
    // Drug cards: you picked the drug, so the section is the big title and the drug sits small above it.
    document.getElementById('ask').textContent=`${nm.name}${nm.sub?' ('+nm.sub+')':''} · ${run.one?'just this section':`${run.cur+1} of ${deck.items.length}`}`;
    drug.textContent=sd.ask;
    drug.className='drug'+(sd.ask.length>22||sd.ask.split(' ').some(w=>w.length>14)?' long':'');
    document.getElementById('sub').textContent=item.d!==title&&!/\(/.test(title)?item.d:'';
  } else {
    document.getElementById('ask').textContent=sd.ask;
    drug.textContent=nm.name;
    drug.className='drug'+(deck.custom?' custom':'')+(nm.name.length>22?' long':'');
    document.getElementById('sub').textContent=nm.sub;
  }
  document.getElementById('ctx').textContent=item.c||'';
  const hint=document.getElementById('cardHint'); hint.textContent=sd.hint||''; hint.hidden=!sd.hint;
  document.getElementById('revisit').innerHTML=run.phase!=='retype'&&run.missCount[run.cur]&&!p.redo?'<span class="chip miss">Missed earlier</span>':'';
  document.getElementById('lbl').textContent='';
  const pe=protEl(); document.getElementById('protRow').hidden=!needProt(item);
  document.getElementById('protSwitchRow').hidden=!item.p; document.getElementById('protSwitch').checked=store.settings.prot!==false;
  document.getElementById('liveSwitch').checked=!!store.settings.live;
  document.getElementById('warnMissSwitch').checked=store.settings.warnMiss!==false;
  // tools: mnemonic (adverse effects) and next word (mechanism, indications, contraindications, notes)
  const answering=run.phase==='answer';
  const mnBtn=document.getElementById('mnBtn'); mnBtn.hidden=!item.mn||!answering||p.redo; mnBtn.innerHTML=p.mn?'Hide mnemonic':`Show mnemonic${p.hinted?'':' <span class="cost">counts as a miss</span>'}`;
  const nwBtn=document.getElementById('nwBtn'); nwBtn.hidden=!item.nw||!fromMemory(); nwBtn.disabled=!!p.nw;
  const skipBtn=document.getElementById('skipBtn'); skipBtn.hidden=!canSkip();
  document.getElementById('actions2').hidden=nwBtn.hidden&&skipBtn.hidden;
  document.getElementById('tools').hidden=mnBtn.hidden;
  const nwh=document.getElementById('nwHint'); nwh.hidden=!(p.nw&&fromMemory()); if(p.nw) nwh.innerHTML=`Next word: <b>${esc(p.nw)}</b>`;
  paintMnem();
  const go=document.getElementById('go'), rv=document.getElementById('reveal');
  ans.readOnly=false; pe.readOnly=false;
  if(run.phase==='answer'){ go.textContent='Check'; rv.hidden=false; ans.placeholder=p.redo?'Type it again from memory':sd.ph; pe.placeholder='S-numbers, or just the numbers'; }
  else if(run.phase==='correct'){ go.textContent=run.redoNext?'Type it from memory':run.queue.length?'Next card':'Finish run'; rv.hidden=true; }
  else {
    const fx=normFix(run.fix); const k=fx.targets[fx.i].kind, kp=!!fx.targets[fx.i].prot;
    go.textContent='Check'; rv.hidden=k!=='memory';
    ans.readOnly=(k==='prot'); pe.readOnly=!(k==='prot'||k==='memory'||kp);
    ans.placeholder=k==='part'?(fx.targets[fx.i].n>1?'Type the parts in the dashed box, in order':'Type the part in the dashed box'):k==='full'?'Type the whole answer above':k==='memory'?'Keep going from memory':'Answer done';
    pe.placeholder=k==='prot'||kp?'Type the protocols in the dashed box':'';
  }
  ans.classList.remove('good','shake'); pe.classList.remove('good','shake');
  syncDrugBoxes();
  syncDraft(); saveRun();
  paintFeedback(); paintLive();
}

function focusActive(){
  try{
    const pe=protEl();
    if(run&&run.phase==='retype'&&normFix(run.fix).targets[normFix(run.fix).i].kind==='prot') pe.focus({preventScroll:true});
    else if(!(drugBoxesOn()&&focusDrugBoxes())) ans.focus({preventScroll:true});
  }catch(e){}
}

// One miss per time a card is shown, however many corrections it takes.
// requeue=false: counted as a miss but not shown again (cards answered with "Mistake warning" on).
function countMiss(requeue){
  const p=pres(); if(p.missed) return;
  const id=run.cur;
  run.misses++; run.missCount[id]=(run.missCount[id]||0)+1;
  if(!run.missed.includes(id)) run.missed.push(id);
  if(requeue!==false&&!run.queue.includes(id)){
    const k=run.ordered?Math.min(run.queue.length,2):Math.min(run.queue.length,3+Math.floor(Math.random()*3));
    run.queue.splice(k,0,id);
  }
  p.missed=true;
  // The run has failed: count it now, once, so quitting or restarting doesn't dodge it. Drilling just the missed cards doesn't count.
  if(!run.subset&&!run.struck){
    const pr=progRec(run.deckId);
    run.progBefore={streak:pr.streak,learned:pr.learned,mastered:pr.mastered,strikes:pr.strikes};
    failRun(pr); run.struck=true;
  }
  touch();
}

function primary(){
  if(!run) return;
  if(run.phase==='correct'){ advance(); return; }
  const item=curItem(); const text=ans.value; const pv=protEl().value; const mode=store.settings.mode; const p=pres();
  const memory=fromMemory();
  if(memory){
    if(!text.trim()){ shake(ans); return; }
    // Cut off partway (after being stopped, or checking while the warning is up): grade only what you've typed.
    const lw=document.getElementById('liveWarn');
    const cut=run.phase==='retype'||(run.phase==='answer'&&lw&&!lw.hidden);
    if(cut&&partialInfo(item,text,mode)){ cutOff(); return; }
    if(needProt(item)&&!pv.trim()){ shake(protEl()); protEl().focus(); return; }
    const g=gradeItem(item,text,mode); const pg=needProt(item)?gradeProt(item.p,pv):null;
    if(g.pass&&(!pg||pg.pass)){
      if(p.hinted){
        countMiss();
        run.redoNext=curDeck().card&&!p.redo;
        run.phase='correct'; run.last={text,prot:pv,hinted:true,hintKind:p.hintKind};
        saveRun(); paint(); ans.classList.add('good');
        return;
      }
      if(p.assisted){
        countMiss(false);
        if(!run.queue.includes(run.cur)&&!run.cleared.includes(run.cur)) run.cleared.push(run.cur);
        run.redoNext=false; run.phase='correct'; run.last={text,prot:pv,assisted:true};
        saveRun(); paint(); ans.classList.add('good');
        if(store.settings.auto) setTimeout(()=>{ if(run&&run.phase==='correct') advance(); },650);
        return;
      }
      if(!run.missCount[run.cur]) run.firstTry++;
      if(!run.queue.includes(run.cur)&&!run.cleared.includes(run.cur)) run.cleared.push(run.cur);
      if(!p.missed) logLearned(run.deckId+'#'+run.cur);
      run.phase='correct'; run.last={text,prot:pv};
      saveRun(); paint();
      ans.classList.add('good');
      if(store.settings.auto&&!(g.order&&g.order.length)) setTimeout(()=>{ if(run&&run.phase==='correct') advance(); },650);
    } else miss(text,g,pv,pg);
    return;
  }
  // retype: everything to fix is checked at once
  run.retried=true;
  const fx=normFix(run.fix); const t=fx.targets[fx.i];
  const okText=t.kind==='prot'?true:t.kind==='part'?grade(t.text,text,mode,optsOf(item)).pass:gradeItem(item,text,mode).pass;
  const okProt=(t.kind==='prot'||t.prot)?gradeProt(item.p,pv).pass:true;
  if(okText&&okProt){
    if(t.kind!=='prot') ans.classList.add('good'); if(t.kind==='prot'||t.prot) protEl().classList.add('good');
    if(curDeck().card&&!p.redo){ saveRun(); setTimeout(redo,350); }
    else { saveRun(); setTimeout(advance,350); }
  } else {
    p.fail=true; saveRun(); paintFeedback();
    if(!okText) shake(ans); if(!okProt) shake(protEl());
    if(okText&&!okProt) try{ protEl().focus({preventScroll:true}); }catch(e){}
  }
}

// Drug cards: after a miss, type the section once more from memory before moving on.
function redo(){
  run.phase='answer'; run.fix=null; run.last=null; run.retried=false; run.redoNext=false;
  const keep=pres().missed; run.pres=freshPres(); run.pres.redo=true; run.pres.missed=keep;
  saveRun(); ans.value=''; protEl().value=''; paint(); focusActive();
}

function miss(text,g,pv,pg){
  const item=curItem();
  const targets=[];
  if(!g||!g.pass){
    if(text.trim()&&g&&!g.special&&g.mistakes&&g.mistakes.length&&g.mistakes.length<3){
      const t=fixTargets(item.a,g,optsOf(item)); if(t.length) t.forEach(x=>targets.push({kind:'part',text:x.text})); else targets.push({kind:'full'});
    } else targets.push({kind:'full'});
  }
  if(needProt(item)&&(!pg||!pg.pass)) targets.push({kind:'prot'});
  run.fix={targets,i:0}; pres().fail=false;
  countMiss();
  run.phase='retype'; run.retried=false; run.last={text,missing:g?g.missing:[],prot:pv||''};
  if(targets[0].kind!=='prot') ans.value='';
  if(targets.some(t=>t.kind==='prot')) protEl().value='';
  saveRun(); paint(); shake(targets[0].kind==='prot'?protEl():ans); focusActive();
  const fb=document.getElementById('fb'); if(fb&&fb.scrollIntoView) fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function override(){
  const id=run.cur; const p=pres();
  if(p.missed){
    const qi=run.queue.indexOf(id); if(qi>=0) run.queue.splice(qi,1);
    run.misses--; run.missCount[id]--;
    if(!run.missCount[id]){ delete run.missCount[id]; run.missed=run.missed.filter(x=>x!==id); run.firstTry++; }
    p.missed=false;
    if(!p.redo&&!p.hinted&&!p.assisted) logLearned(run.deckId+'#'+id);
    // Marked right after all: if that was the run's only miss, the run hasn't failed after all.
    const pr=store.progress[run.deckId], pb=run.progBefore;
    if(pr&&pb&&run.misses===0){
      pr.streak=pb.streak; pr.mastered=!!pb.mastered; if(pb.learned!=null) pr.learned=pb.learned; if(pb.strikes!=null) pr.strikes=pb.strikes;
      delete pr.slips; run.progBefore=null; run.struck=false; touch();
    }
  }
  if(!run.queue.includes(id)&&!run.cleared.includes(id)) run.cleared.push(id);
  run.phase='correct'; run.redoNext=false; run.last.hinted=false;
  saveRun(); ans.value=run.last.text; protEl().value=run.last.prot||''; paint();
}

function advance(){
  if(!run) return;
  if(run.redoNext){ redo(); return; }
  if(!run.queue.length){ finish(); return; }
  run.cur=run.queue.shift(); run.phase='answer'; run.last=null; run.retried=false; run.fix=null; run.pres=freshPres();
  saveRun(); ans.value=''; protEl().value=''; paint();
  try{ ans.focus({preventScroll:true}); }catch(e){}
  window.scrollTo({top:0,behavior:'smooth'});
}

// Skip for now: the card (or drug-card section) goes to the end of the line and comes back after all the others.
// Skipping isn't a miss; a hint or a warning already shown on it still counts.
function canSkip(){ return !!run&&run.phase==='answer'&&!pres().redo&&!run.redoNext&&run.queue.length>0; }
function skipCard(){
  if(!canSkip()) return;
  const p=pres(); if(p.assisted||p.hinted||p.nw) countMiss(false);
  const id=run.cur; run.queue=run.queue.filter(x=>x!==id); run.queue.push(id);
  advance();
}

function shake(el){ el=el||ans; if(el===ans&&drugBoxesOn()) el=document.getElementById('drugBoxes'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

function finish(){
  const deck=curDeck();
  result={deckId:deck.id,total:run.ids.length,firstTry:run.firstTry,misses:run.misses,missed:run.missed.slice(),subset:run.subset,ids:run.ids.slice()};
  if(!run.subset){
    const p=progRec(deck.id);
    p.runs=(p.runs||0)+1; if(result.misses===0) p.perfect=(p.perfect||0)+1;
    p.lastMisses=result.misses; p.best=p.best==null?result.misses:Math.min(p.best,result.misses); p.lastAt=Date.now();
    p.lastPct=Math.round(run.firstTry/run.ids.length*100);
    if(result.misses===0){
      const was=p.learned; p.strikes=0; p.streak=(p.streak||0)+1; p.learned=true;
      if(!was) result.newlyLearned=true;
      if(p.streak>=MASTER_RUNS&&!p.mastered){ p.mastered=true; p.masteredAt=Date.now(); result.newlyMastered=true; }
    } else if(!run.struck) failRun(p);
    result.prog=progOf(deck.id); touch();
  }
  if(run.one) result.one=true; else dropRun(deck.id);
  run=null;
  ui.screen='results'; ui.deckId=deck.id; render(); window.scrollTo({top:0});
}

function itemLabel(deck,it){ return deck.card?`${secOf(it,deck).ask}${it.d!==deck.title&&!/\(/.test(deck.title)?' · '+it.d:''}`:it.d; }

function progBar(cp,deck){
  const pct=cp.mastered?100:cp.learned?Math.min(100,cp.streak*10):cp.lastPct;
  const top=cp.mastered?'Mastered':cp.learned?'Learned':'';
  const label=cp.mastered?'':cp.learned?`${pct}% from mastery`:`${pct}% learned`;
  const what=deck.card?'card':'deck';
  const warn=cp.strikes>=1&&(cp.mastered||cp.learned)?`<p class="pbar-warn">One more failed run in a row and ${cp.mastered?`this ${what} drops back to Learned`:`this ${what} loses Learned`}.</p>`:'';
  const kind=cp.mastered?' gold':cp.learned?' ok':'';
  return `<div class="pbar-wrap">${top?`<div class="pbar-top${kind}">${top}</div>`:''}
    <div class="pbar${kind}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${esc(label||top)}"><i style="width:${pct}%"></i></div>
    ${label?`<div class="pbar-label">${label}</div>`:''}${warn}</div>`;
}

function renderAbout(){
  app.innerHTML=`
  <div class="topbar"><button class="back" data-act="home"><span class="chev" aria-hidden="true">‹</span>All decks</button><div class="tb-right">About</div></div>
  <h1 class="h-res">About</h1>
  <section class="about">
    <p>Type each answer from memory, in full. Typos are forgiven; missing words are not. Miss and you retype the answer before moving on, and the card comes back a few cards later until you clear the deck with zero errors.</p>
    <h2 class="sect">Grading</h2>
    <p><b>Key words</b> (Word for word off): every word counts except small connecting words like “of”, “the”, “with” and “to”. Numbers, units, routes and “or” versus “and” always have to match; an extra “and” that just joins a list is fine.</p>
    <p><b>Word for word</b>: every word, in protocol order. You can skip “a”, “an”, “the” and “but”.</p>
    <p>Either way, typos are forgiven. A word or two slightly out of place still passes and gets pointed out; anything more scrambled fails.</p>
    <h2 class="sect">Learned and Mastered</h2>
    <p>Before a deck is Learned, the bar shows how many cards you got right the first time in your last full run. One perfect run (no misses, nothing coming back) makes it Learned and starts the mastery bar at 10%. Each perfect run in a row adds 10%; 10 in a row is Mastered.</p>
    <p>A run fails at its first miss, and it counts even if you restart. A failed run sets the mastery bar back to 0%. Two failed runs in a row drop a Mastered deck to Learned, or a Learned deck back to zero. A perfect run in between clears the first one. Drilling just the missed cards doesn't count either way.</p>
    <p>Finish a full run at least every 169 hours or the deck resets to zero. A red countdown shows on the deck for the last 24 hours.</p>
    <h2 class="sect">Source</h2>
    <p>Card text is copied word for word from the County of San Diego EMS P-115 Medication List (7/1/2026), from the 2026-27 Protocol &amp; Policy Updates Packet. Indication cards also ask for the protocol numbers each drug appears in.</p>
  </section>`;
}

function renderResults(){
  const deck=deckById(result.deckId); const r=result;
  if(r.one){
    const it=deck.items[r.ids[0]], label=it?itemLabel(deck,it):'';
    app.innerHTML=`
  <div class="topbar"><button class="back" data-act="review" data-id="${esc(deck.id)}"><span class="chev" aria-hidden="true">‹</span>Review</button><div class="tb-right">${esc(deck.short)}</div></div>
  <h1 class="h-res">${r.misses===0?'Right on the first try':'Done'}</h1>
  <p class="lede">${esc(deck.card?deck.title+' \u00b7 '+label:label)}${r.misses===0?'':`: ${r.misses} miss${r.misses===1?'':'es'} along the way`}. Practice like this doesn\u2019t change the deck\u2019s progress.</p>
  <div class="actions">
    <button class="btn primary" data-act="drillone" data-id="${esc(deck.id)}" data-i="${r.ids[0]}">Drill it again</button>
    <button class="btn" data-act="review" data-id="${esc(deck.id)}">Back to review</button>
  </div>`;
    return;
  }
  const perfect=r.misses===0;
  const pct=Math.round(r.firstTry/r.total*100);
  const missedList=r.missed.map(i=>{ const it=deck.items[i]; return it?`<li><b>${esc(itemLabel(deck,it))}</b>${it.c?`<span>${esc(it.c)}</span>`:''}</li>`:''; }).join('');
  app.innerHTML=`
  <div class="topbar"><button class="back" data-act="${deck.card?'cards':'home'}"><span class="chev" aria-hidden="true">‹</span>${deck.card?'Drug cards':'All decks'}</button><div class="tb-right">${esc(deck.short)}</div></div>
  ${r.newlyMastered?'<div class="stamp gold">Mastered</div>':perfect&&!r.subset?'<div class="stamp">Learned</div>':''}
  <h1 class="h-res">${perfect?(r.subset?'Missed cards cleared':'Perfect run'):'Run complete'}</h1>
  <p class="lede">${perfect?(r.subset?'Every missed card right on the first try. Run the full deck to go for a perfect score.':deck.card?'Every section right on the first try.':'Every card right on the first try.'):`${r.missed.length} ${deck.card?'section':'card'}${r.missed.length===1?'':'s'} missed. Restart and go for zero.`}</p>
  ${!r.subset&&r.prog?progBar(r.prog,deck):''}
  <dl class="stats">
    <div><dt>${deck.card?'Sections':'Cards'}</dt><dd>${r.total}</dd></div>
    <div><dt>First try</dt><dd>${pct}%</dd></div>
    <div><dt>Misses</dt><dd>${r.misses}</dd></div>
  </dl>
  ${r.missed.length?`<section><h2 class="sect">Missed this run</h2><div class="list"><ul class="mlist">${missedList}</ul></div></section>`:''}
  <div class="actions">
    <button class="btn primary" data-act="restartdeck">Restart ${deck.card?'card':'full deck'}</button>
    ${r.missed.length?`<button class="btn" data-act="drillmissed">Drill the ${r.missed.length} missed</button>`:''}
  </div>`;
}

function renderStudy(){
  const deck=deckById(ui.deckId);
  const items=deck.items.map(it=>{
    const g=parseAnswer(it.a).map(s=>s.k?`<mark class="k">${esc(s.disp)}</mark>`:esc(s.s)).join('');
    const mn=it.mn?`<span class="c">Mnemonic: ${esc(mnemonicLetters(it.mn,false))}${store.mnem&&store.mnem[it.d]?' · Mine: '+esc(store.mnem[it.d]):''}</span>`:'';
    return `<li><div class="q-row"><span class="q">${esc(itemLabel(deck,it))}</span><button class="btn small" data-act="drillone" data-id="${esc(deck.id)}" data-i="${deck.items.indexOf(it)}" aria-label="Drill just ${esc(itemLabel(deck,it))}">Drill</button></div>${it.c?`<span class="c">${esc(it.c)}</span>`:''}<span class="a">${g}</span>${it.p?`<span class="c">Protocols: ${esc(it.p.join(', '))}</span>`:''}${mn}${it.n?`<span class="c">${esc(it.n)}</span>`:''}</li>`;
  }).join('');
  const r=loadRun(deck);
  app.innerHTML=`
  <div class="topbar"><button class="back" data-act="${deck.card?'cards':'home'}"><span class="chev" aria-hidden="true">‹</span>${deck.card?'Drug cards':'All decks'}</button><div class="tb-right">${deck.items.length} ${deck.unit}</div></div>
  <h1 class="h-res">${esc(deck.title)}</h1>
  <p class="lede">${deck.card?'The full drug card':esc(deck.ask)}, word for word from P-115.</p>
  <div class="actions"><button class="btn primary" data-act="start" data-id="${esc(deck.id)}">${r?'Resume drill':'Start drill'}</button></div>
  <div class="list"><ul class="mlist study">${items}</ul></div>`;
}

const EXAMPLE='Adenosine, first dose :: [6 mg] rapid IV/IO\nAtropine, unstable bradycardia max :: [3 mg]\nVF / pulseless VT, epi starts after :: [second|2nd] [defibrillation|shock]';
function renderEdit(){
  const c=store.custom.find(x=>x.id===ui.editId);
  app.innerHTML=`
  <div class="topbar"><button class="back" data-act="home"><span class="chev" aria-hidden="true">‹</span>All decks</button><div class="tb-right">${c?'Edit deck':'New deck'}</div></div>
  <h1 class="h-res">${c?'Edit deck':'New deck'}</h1>
  <div class="field"><label for="dName">Deck name</label><input type="text" id="dName" value="${c?esc(c.title):''}" placeholder="Cardiac arrest protocol"></div>
  <div class="field"><label for="dAsk">What each card asks for</label><input type="text" id="dAsk" value="${c?esc(c.ask||''):''}" placeholder="Answer"></div>
  <div class="field">
    <label for="dSrc">Cards</label>
    <p class="note">One card per line: <code>prompt :: answer</code>. Put words that must appear in <code>[brackets]</code> and separate accepted alternatives with <code>|</code>, as in <code>[VF|ventricular fibrillation]</code>. A line with no brackets is graded on every word.</p>
    <textarea id="dSrc" spellcheck="false" placeholder="${esc(EXAMPLE)}">${c?esc(c.src):''}</textarea>
    <p class="note" id="dCount"></p>
  </div>
  ${ui.err?`<p class="err">${esc(ui.err)}</p>`:''}
  <div class="actions">
    <button class="btn primary" data-act="save">Save deck</button>
    ${c?`<button class="btn danger" id="delBtn" data-act="del">Delete</button>`:''}
  </div>`;
  const src=document.getElementById('dSrc'), cnt=document.getElementById('dCount');
  const upd=()=>{ const p=parseSrc(src.value); cnt.textContent=`${p.items.length} card${p.items.length===1?'':'s'}${p.skipped?` · ${p.skipped} line${p.skipped===1?'':'s'} skipped (no ::)`:''}`; };
  src.addEventListener('input',upd); upd();
}

function render(){
  armed=null; decayAll();
  if(ui.screen==='drill'&&run) renderDrill();
  else if(ui.screen==='results'&&result) renderResults();
  else if(ui.screen==='study'&&deckById(ui.deckId)) renderStudy();
  else if(ui.screen==='edit') renderEdit();
  else if(ui.screen==='cards') renderCards();
  else if(ui.screen==='about') renderAbout();
  else { ui.screen='home'; renderHome(); }
}

// Drill one thing (a card, or one section of a drug card) from Review. It's practice: it doesn't count toward the
// deck's progress, isn't saved, and never touches a run of the whole deck you have going.
function startOne(id,i){
  const deck=deckById(id); if(!deck||!deck.items[i]) return;
  run=newRun(deck,[i]); run.one=true;
  ui.screen='drill'; ui.deckId=id; render(); window.scrollTo({top:0});
}
function startDeck(id,fresh,subset){
  const deck=deckById(id); if(!deck||!deck.items.length) return;
  run=(!fresh&&!subset&&loadRun(deck))||newRun(deck,subset);
  if(!run.pres) run.pres=freshPres();
  saveRun(); ui.screen='drill'; ui.deckId=id; render(); window.scrollTo({top:0});
}

function arm(btn,key,label){
  if(armed===key){ armed=null; clearTimeout(armTimer); return true; }
  armed=key; btn.classList.add('armed'); const old=btn.textContent; btn.textContent=label;
  clearTimeout(armTimer); armTimer=setTimeout(()=>{ armed=null; btn.classList.remove('armed'); btn.textContent=old; },3000);
  return false;
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  switch(a){
    case 'home': ui.screen='home'; ui.err=''; render(); window.scrollTo({top:0}); break;
    case 'cards': ui.screen='cards'; render(); window.scrollTo({top:0}); break;
    case 'about': ui.screen='about'; render(); window.scrollTo({top:0}); break;
    case 'start': startDeck(id,false); break;
    case 'study': ui.screen='study'; ui.deckId=id; render(); window.scrollTo({top:0}); break;
    case 'mode': store.settings.mode=b.dataset.v; touch(); render(); break;
    case 'go': primary(); break;
    case 'reveal':
      // With something typed, Show answer checks it like Check: if it's right it counts, and if not you only fix
      // what's wrong (the answer shows either way). With nothing typed, it just shows the answer.
      if(run&&fromMemory()){
        if(!ans.value.trim()) miss('',null,protEl().value,null);
        else if(partialInfo(curItem(),ans.value,store.settings.mode)) cutOff();
        else primary();
      }
      break;
    case 'override': if(run&&run.phase==='retype') override(); break;
    case 'skip': skipCard(); break;
    case 'nextword': {
      if(!run||!fromMemory()||pres().nw) break;
      const w=nextWord(curItem(),ans.value,store.settings.mode);
      pres().nw=w||'(you’ve reached the end)'; pres().hintKind=pres().hintKind==='mnemonic'?'both':'next'; pres().hinted=true; saveRun(); paint();
      try{ ans.focus({preventScroll:true}); }catch(err){}
      break;
    }
    case 'mnem': { const pp=pres(); pp.mn=!pp.mn; pp.mnEdit=false; if(pp.mn&&!pp.hinted){ pp.hinted=true; pp.hintKind='mnemonic'; } if(pp.mn) rememberView(curItem().d,mnView(curItem())); saveRun(); paint(); break; }
    case 'mnview': {
      const v=b.dataset.v; pres().mnView=v; pres().mnEdit=false;
      if(v!=='mine'){ store.settings.mnemView=v; touch(); }
      rememberView(curItem().d,v); saveRun();
      paintMnem(); break;
    }
    case 'mnedit': pres().mnEdit=true; paintMnem(); const mi=document.getElementById('mnInput'); if(mi) mi.focus(); break;
    case 'mnsave': {
      const v=(document.getElementById('mnInput').value||'').trim(); const d=curItem().d;
      store.mnem=store.mnem||{};
      if(v) store.mnem[d]=v; else delete store.mnem[d];
      touch(); pres().mnEdit=false; pres().mnView=v?'mine':null; if(v) rememberView(d,'mine'); else if(store.mnemLast&&store.mnemLast[d]==='mine') rememberView(d,null); paintMnem(); break;
    }
    case 'mndelete': { store.mnem=store.mnem||{}; delete store.mnem[curItem().d]; if(store.mnemLast&&store.mnemLast[curItem().d]==='mine') rememberView(curItem().d,null); touch(); pres().mnEdit=false; pres().mnView=null; paintMnem(); break; }
    case 'restart': if(arm(b,'restart','Tap again to restart')){ const d=run.deckId; if(run.one) startOne(d,run.ids[0]); else { dropRun(d); startDeck(d,true); } } break;
    case 'drillone': startOne(id,+b.dataset.i); break;
    case 'review': ui.screen='study'; ui.deckId=id; render(); window.scrollTo({top:0}); break;
    case 'restartdeck': startDeck(result.deckId,true); break;
    case 'drillmissed': startDeck(result.deckId,true,result.missed); break;
    case 'new': ui.screen='edit'; ui.editId=null; ui.err=''; render(); window.scrollTo({top:0}); break;
    case 'edit': ui.screen='edit'; ui.editId=id; ui.err=''; render(); window.scrollTo({top:0}); break;
    case 'save': {
      const title=document.getElementById('dName').value.trim();
      const ask=document.getElementById('dAsk').value.trim();
      const src=document.getElementById('dSrc').value;
      const p=parseSrc(src);
      if(!title){ ui.err='Give the deck a name.'; keepEdit(title,ask,src); break; }
      if(!p.items.length){ ui.err='Add at least one card, written as prompt :: answer.'; keepEdit(title,ask,src); break; }
      let c=store.custom.find(x=>x.id===ui.editId);
      if(c){ Object.assign(c,{title,ask,src,updatedAt:Date.now()}); dropRun(c.id); }
      else { c={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title,ask,src,updatedAt:Date.now()}; store.custom.push(c); }
      touch(); ui.screen='home'; ui.err=''; render(); window.scrollTo({top:0});
      break;
    }
    case 'del': if(arm(b,'del','Tap again to delete')){ store.custom=store.custom.filter(x=>x.id!==ui.editId); delete store.progress[ui.editId]; dropRun(ui.editId); touch(); ui.screen='home'; render(); } break;
  }
});

function dayRow(){
  const k=streakNow(), date=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const tip=k.doneToday?'Today counts toward your streak.':`${Math.max(0,STREAK_MIN-k.today)} more answered with no mistakes today to keep your streak going.`;
  return `<section class="dayrow" aria-label="Today"><span class="day-date">${esc(date)}</span><span class="day-streak${k.doneToday?'':' pending'}" title="${esc(tip)}"><span class="fire" aria-hidden="true">🔥</span> ${k.n} day streak</span></section>`;
}

function keepEdit(title,ask,src){
  render();
  document.getElementById('dName').value=title; document.getElementById('dAsk').value=ask;
  const s=document.getElementById('dSrc'); s.value=src; s.dispatchEvent(new Event('input'));
}

/* Boot, keeping the viewer's place across a republish */
function start(data){
  data=data||{};
  if(data.ui&&data.ui.screen){
    ui=Object.assign(ui,data.ui);
    if(data.run) run=data.run;
    if(data.result) result=data.result;
    if(ui.screen==='drill'&&run&&!deckById(run.deckId)) { run=null; ui.screen='home'; }
  }
  render();
  initRemote();
}
try{ window.claude?.hot?.snapshot?.(()=>({ui:{screen:ui.screen,deckId:ui.deckId,editId:ui.editId,q:ui.q},run,result})); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data??{});

})();
